# Mock Creator — Docker Compose v5 (bind mounts = data survives every pull/deploy)
# Paste into Dockge / Dokploy or run: docker compose up -d
#
#   GUI:     http://HOST:PORT/creator
#   Admin:   http://HOST:PORT/_/
#   Update:  docker compose pull && docker compose up -d
#
# DATA IS PERSISTENT: pb_data/ and data/ are real folders next to this file
# (bind mounts). They survive image updates, stack renames and even
# `docker compose down -v`. Backup = copy these two folders.
# Do NOT delete these folders; that is the only way data is lost.
#
# One-time migration from the OLD named volumes (only if you had data there):
#   docker run --rm -v <oldstack>_mock-state:/from -v "$PWD/pb_data":/to alpine sh -c "cp -a /from/. /to/"

services:
  mock-creator:
    image: shivad90/mock-creator:latest
    container_name: mock-creator
    restart: unless-stopped
    ports:
      - "33445:8090"
    environment:
      # ---- REQUIRED: your API keys ----
      OPENROUTER_API_KEY: sk-or-YOUR_KEY_HERE
      MAGNIFIC_API_KEY: MS_YOUR_KEY_HERE
      # Google Gemini API key - PRIMARY author (direct Gemini API, no OpenRouter).
      # Get it from https://aistudio.google.com/apikey. When quota fails/exceeds,
      # authoring auto-falls back to OpenRouter (llm_author_model).
      GEMINI_API_KEY: YOUR_GEMINI_KEY_HERE
      # Fal.ai key - used when the Image provider in /creator config is fal-ai/z-image/turbo.
      # Get it from https://fal.ai/dashboard/keys. Used for: image generation,
      # balance checks and wrong-model verification.
      FAL_KEY: YOUR_FAL_KEY_HERE

      # ---- REQUIRED: PocketBase superuser (login for /creator) ----
      PB_SUPERUSER_EMAIL: admin@yourdomain.com
      PB_PASSWORD: change-this-to-a-strong-password

      # ---- REQUIRED: push exam to teacher app (ubt.wts.com.np) ----
      # Overrides whatever is saved in the /creator config editor.
      # Use the admin password for shiva@cld.com.np on ubt.wts.com.np.
      MOCK_PB_PASS: ""

      # ---- UTF-8 hardening (prevents ascii-codec crashes) ----
      LANG: C.UTF-8
      LC_ALL: C.UTF-8
      PYTHONUTF8: "1"
      PYTHONIOENCODING: utf-8

      # ---- internals (do not change) ----
      PB_URL: http://127.0.0.1:8090
      PB_PORT: "8090"
      WORK_ROOT: /app/data
    volumes:
      - ./pb_data:/app/pb_data      # PocketBase DB + files (PERMANENT)
      - ./data:/app/data            # job artifacts (PERMANENT)
