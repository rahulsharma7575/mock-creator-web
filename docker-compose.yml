# Himal KB Mock Creator — Docker Compose (v2: PocketBase + worker)
# Paste this file into Dockge / Dokploy (or run `docker compose up -d`).
# All config is inline — no separate .env file needed. Fill in your real keys.
#
#   GUI:  http://HOST:HOST_PORT/creator    Admin: http://HOST:HOST_PORT/_/
#
# Data persists in the mock-state (PocketBase DB + files) and mock-work
# (job artifacts) volumes. Pull the new image to update: docker compose pull && up -d.

services:
  mock-creator:
    image: shivad90/mock-creator:latest
    container_name: mock-creator
    restart: unless-stopped
    ports:
      - "33445:8090"
    environment:
      # --- your real keys ---
      OPENROUTER_API_KEY: sk-or-YOUR_KEY_HERE
      MAGNIFIC_API_KEY: MS_YOUR_KEY_HERE
      # --- PocketBase superuser (login for /creator) ---
      PB_SUPERUSER_EMAIL: admin@yourdomain.com
      PB_PASSWORD: change-this-to-a-strong-password
      # --- internals (do not change) ---
      PB_URL: http://127.0.0.1:8090
      PB_PORT: "8090"
      WORK_ROOT: /app/data
    volumes:
      - mock-state:/app/pb_data
      - mock-work:/app/data

volumes:
  mock-state:
  mock-work:
