<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Himal KB Mock Creator</title>
<style>
  :root{
    --bg:#0f172a; --card:#1e293b; --line:#334155; --txt:#e2e8f0; --mut:#94a3b8;
    --acc:#38bdf8; --ok:#34d399; --err:#f87171; --warn:#fbbf24;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--txt);font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
  .wrap{max-width:860px;margin:0 auto;padding:16px}
  header{display:flex;align-items:center;gap:10px;padding:14px 0}
  header h1{font-size:1.25rem;margin:0;letter-spacing:.3px}
  header .dot{width:10px;height:10px;border-radius:50%;background:var(--mut)}
  header .dot.run{background:var(--warn);animation:pulse 1s infinite}
  header .dot.done{background:var(--ok)}
  header .dot.failed{background:var(--err)}
  @keyframes pulse{50%{opacity:.35}}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:16px}
  h2{font-size:.95rem;margin:0 0 12px;color:var(--acc);text-transform:uppercase;letter-spacing:1px}
  label{display:block;font-size:.8rem;color:var(--mut);margin:10px 0 4px}
  input[type=number],select{width:100%;padding:9px 10px;border:1px solid var(--line);border-radius:9px;background:#0b1526;color:var(--txt);font-size:.95rem}
  .row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  @media (max-width:560px){.row{grid-template-columns:1fr}}
  .btns{display:flex;gap:10px;margin-top:16px;flex-wrap:wrap}
  button{padding:11px 18px;border:none;border-radius:10px;font-size:.95rem;font-weight:600;cursor:pointer}
  #btnStart{background:var(--acc);color:#06283d;flex:1}
  #btnStart:disabled{opacity:.45;cursor:not-allowed}
  #btnDry{background:#334155;color:var(--txt);flex:1}
  #btnDry:disabled{opacity:.45;cursor:not-allowed}
  #btnLogout{background:transparent;color:var(--mut);border:1px solid var(--line);padding:8px 12px}
  #status{margin-top:14px;font-size:.85rem;color:var(--mut)}
  #status b{color:var(--txt)}
  #log{background:#0b1526;border:1px solid var(--line);border-radius:10px;height:300px;overflow-y:auto;
       font-family:Consolas,monospace;font-size:.78rem;line-height:1.5;padding:10px;white-space:pre-wrap;word-break:break-all}
  #log .dim{color:#475569}
  #report{margin-top:12px;font-size:.85rem}
  #report a{color:var(--acc)}
  .badge{display:inline-block;padding:2px 10px;border-radius:99px;font-size:.75rem;font-weight:700}
  .badge.idle{background:#334155;color:var(--txt)}
  .badge.running{background:#78350f;color:var(--warn)}
  .badge.done{background:#052e22;color:var(--ok)}
  .badge.failed{background:#450a0a;color:var(--err)}
  .hint{font-size:.78rem;color:var(--mut);margin-top:8px}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <span class="dot" id="dot"></span>
    <h1>Himal KB Mock Creator</h1>
    <span style="flex:1"></span>
    <span class="badge idle" id="badge">IDLE</span>
    <button id="btnLogout">Logout</button>
  </header>

  <div class="card">
    <h2>New Mock</h2>
    <div class="row">
      <div>
        <label for="mock">Mock number (blank = auto next)</label>
        <input type="number" id="mock" min="1" max="999" placeholder="auto">
      </div>
      <div>
        <label for="imgModel">Image model</label>
        <select id="imgModel">
          <option value="z-image">z-image (Magnific, 5 credits/img)</option>
          <option value="nano-banana">nano-banana (OpenRouter $)</option>
        </select>
      </div>
    </div>
    <div class="row">
      <div>
        <label for="authorModel">Author model</label>
        <select id="authorModel">
          <option value="google/gemini-2.5-flash">google/gemini-2.5-flash (default)</option>
          <option value="google/gemini-3.5-flash">google/gemini-3.5-flash</option>
          <option value="deepseek/deepseek-v4-flash">deepseek/deepseek-v4-flash (cheapest)</option>
        </select>
      </div>
      <div>
        <label for="proofModel">Proofread model</label>
        <select id="proofModel">
          <option value="qwen/qwen3.5-flash-02-23">qwen/qwen3.5-flash-02-23 (default)</option>
          <option value="google/gemini-3.5-flash">google/gemini-3.5-flash</option>
        </select>
      </div>
    </div>
    <div class="btns">
      <button id="btnDry">Dry Run (no cost)</button>
      <button id="btnStart">Start Full Mock</button>
    </div>
    <div class="hint">Full mock: 40 questions &rarr; proofread &rarr; PocketBase &rarr; audio (TTS) &rarr; images (Magnific) &rarr; upload. Costs real money — check before running.<br>Dry run: author + validate only (no PB/audio/images, small LLM cost only).</div>
    <div id="status"></div>
  </div>

  <div class="card">
    <h2>Live Log</h2>
    <div id="log"><span class="dim">[idle] waiting for a job…</span></div>
    <div id="report"></div>
  </div>
</div>

<script>
(function(){
  var offset = 0, pollTimer = null, running = false;
  var $ = function(id){ return document.getElementById(id); };
  var CREDS = sessionStorage.getItem("mc_auth");

  function login(){
    var u = prompt("Username:");
    if (u === null) return null;
    var p = prompt("Password:");
    if (p === null) return null;
    CREDS = "Basic " + btoa(u + ":" + p);
    sessionStorage.setItem("mc_auth", CREDS);
    return CREDS;
  }

  function authHeaders(){
    if (CREDS) return { "Authorization": CREDS };
    return {};
  }

  function api(path, opts){
    opts = opts || {};
    opts.headers = Object.assign({ "Content-Type": "application/json" }, authHeaders(), opts.headers || {});
    return fetch(path, opts).then(function(res){
      if (res.status === 401) {
        CREDS = null;
        sessionStorage.removeItem("mc_auth");
        CREDS = login();
        if (!CREDS) throw new Error("Login required");
        return api(path, opts);
      }
      if (!res.ok) return res.json().then(function(b){ throw new Error((b.detail && (b.detail.message || b.detail)) || res.status); });
      return res.json();
    });
  }

  function renderStatus(s){
    var badge = $("badge"), dot = $("dot");
    badge.className = "badge " + s.state;
    badge.textContent = (s.state || "idle").toUpperCase();
    dot.className = "dot " + (s.state === "running" ? "run" : s.state === "done" ? "done" : s.state === "failed" ? "failed" : "");
    running = (s.state === "running");
    $("btnStart").disabled = running;
    $("btnDry").disabled = running;
    var parts = [];
    if (s.actual_mock) parts.push("Mock #" + s.actual_mock);
    if (s.started_at) parts.push("started " + s.started_at);
    if (s.finished_at) parts.push("finished " + s.finished_at);
    if (s.exit_code !== null && s.exit_code !== undefined) parts.push("exit " + s.exit_code);
    $("status").innerHTML = parts.length ? "<b>" + parts.join(" — ") + "</b>" : "";
    var rep = s.report;
    if (rep) {
      $("report").innerHTML = "<b>Run report:</b> " +
        (rep.questions ? "questions=" + rep.questions + " " : "") +
        (rep.audio ? "audio=" + rep.audio + " " : "") +
        (rep.images ? "images=" + rep.images + " " : "") +
        (rep.pb_created !== undefined ? "pb=" + rep.pb_created + " " : "") +
        (rep.duration ? "duration=" + rep.duration : "");
    }
  }

  function appendLog(lines){
    var el = $("log");
    lines.forEach(function(l){
      var d = document.createElement("div");
      d.textContent = l;
      el.appendChild(d);
    });
    el.scrollTop = el.scrollHeight;
  }

  function poll(){
    api("/api/status").then(function(s){
      renderStatus(s);
      if (s.offset > offset) {
        api("/api/logs?offset=" + offset).then(function(lg){
          offset = lg.offset;
          appendLog(lg.lines);
        }).catch(function(){});
      }
      if (s.state === "running") setTimeout(poll, 2500);
      else if (pollTimer !== null) { clearTimeout(pollTimer); pollTimer = null; }
    }).catch(function(e){ $("log").innerHTML = '<span class="dim">[err] ' + e.message + '</span>'; });
  }

  function start(dry){
    var body = {
      author_model: $("authorModel").value,
      proof_model: $("proofModel").value,
      img_model: $("imgModel").value,
      dry_run: !!dry
    };
    var n = $("mock").value.trim();
    if (n) body.mock = parseInt(n, 10);
    api("/api/start", { method: "POST", body: JSON.stringify(body) }).then(function(r){
      offset = 0;
      $("log").innerHTML = "";
      $("report").innerHTML = "";
      $("status").innerHTML = "<b>Job started: " + r.job_id + "</b>";
      poll();
    }).catch(function(e){ alert("Start failed: " + e.message); });
  }

  $("btnStart").addEventListener("click", function(){
    if (!confirm("Run FULL mock? This spends real money (TTS + ~200 Magnific credits). Continue?")) return;
    start(false);
  });
  $("btnDry").addEventListener("click", function(){ start(true); });
  $("btnLogout").addEventListener("click", function(){
    CREDS = null; sessionStorage.removeItem("mc_auth");
    location.reload();
  });

  CREDS = CREDS || login();
  if (!CREDS) { $("log").innerHTML = '<span class="dim">Login required — refresh to try again.</span>'; return; }
  poll();
})();
</script>
</body>
</html>
